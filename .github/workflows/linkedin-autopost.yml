# Unattended LinkedIn posts. No approval step.
#
# Weekdays, twice, aimed at US Eastern engagement hours:
#   13:15 UTC = 8:15 AM EST / 9:15 AM EDT
#   17:30 UTC = 12:30 PM EST / 1:30 PM EDT
# GitHub cron is UTC and does not follow daylight saving time.
# Each run publishes at most one post. The daily cap is 2 on an
# America/New_York day, with at least 3 hours between posts.
#
# Required secrets: LINKEDIN_TOKEN_JSON, XAI_API_KEY
# Refresh, when LinkedIn granted a refresh token: LINKEDIN_CLIENT_ID,
# LINKEDIN_CLIENT_SECRET
# The token JSON is never written into the repo. Only state/linkedin_posted.json
# is committed, and only after a successful publish.

name: LinkedIn autopost

on:
  schedule:
    - cron: "15 13 * * 1-5"
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate a post without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: linkedin-autopost
  cancel-in-progress: false

jobs:
  autopost:
    name: Autopost to LinkedIn
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install x-automation
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Check required secrets
        env:
          LINKEDIN_TOKEN_JSON: ${{ secrets.LINKEDIN_TOKEN_JSON }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${XAI_API_KEY}" ]; then
            echo "::error::Missing GitHub secret XAI_API_KEY"
            missing=1
          fi
          if [ "${DRY_RUN}" != "true" ] && [ -z "${LINKEDIN_TOKEN_JSON}" ]; then
            echo "::error::Missing GitHub secret LINKEDIN_TOKEN_JSON. Run linkedin auth locally and set the secret to data/linkedin_token.json. Do not commit that file."
            missing=1
          fi
          exit "${missing}"

      - name: Generate and publish
        env:
          LINKEDIN_TOKEN_JSON: ${{ secrets.LINKEDIN_TOKEN_JSON }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: grok-3-mini
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            python -m x_automation.cli linkedin autopost --dry-run
          else
            python -m x_automation.cli linkedin autopost
          fi

      - name: Explain a failed run
        if: failure()
        run: |
          echo "::error title=LinkedIn autopost failed::Read the log above. If it says LINKEDIN AUTH FAILURE, the personal token expired or was rejected. On your machine run: python -m x_automation.cli linkedin auth. Then update the LINKEDIN_TOKEN_JSON secret (gh secret set LINKEDIN_TOKEN_JSON < data/linkedin_token.json) and re-run this workflow. Personal tokens last about 60 days when LinkedIn does not grant a refresh token."

      - name: Commit posted history
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/linkedin_posted.json
          if git diff --staged --quiet; then
            echo "No posted-history change."
            exit 0
          fi
          git commit -m "chore: record LinkedIn autopost history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
